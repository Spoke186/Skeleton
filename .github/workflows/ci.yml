name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy voldesk/
      - name: plt.savefig confined to voldesk/figures/
        run: python scripts/check_savefig.py

  test:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    # The postgres service below is a container. CLAUDE.md section 3 bans Docker on the
    # development machine and in production; an ephemeral CI runner is neither.
    # See docs/adr/0004-ci-uses-a-postgres-service-container.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voldesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/voldesk_test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pytest with coverage
        run: pytest --cov=voldesk --cov-report=term-missing --cov-report=xml
      - name: Coverage gate on the pricing core (CLAUDE.md section 7 requires > 90%)
        run: |
          coverage report --include="voldesk/quant/pricing/*" --fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
